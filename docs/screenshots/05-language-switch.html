<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>System Restore Tool — Language Switch</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0c0c0c;
    color: #c0c0c0;
    font-family: 'Consolas', 'Cascadia Code', 'Microsoft YaHei', 'PingFang SC', monospace;
    font-size: 14px;
    line-height: 1.6;
    padding: 16px 20px;
    width: 700px;
  }
  .header {
    color: #ff00ff;
    text-align: center;
    border: 1px solid #ff00ff;
    padding: 6px 0;
    margin: 0 0 14px;
  }
  .lang-current { color: #00ff00; }
  .lang-other   { color: #c0c0c0; }
  .prompt { color: #ffffff; margin-top: 14px; }
  .footer { color: #555; margin-top: 10px; }
</style>
</head>
<body>

<div class="header">🌐 Interface language / Язык интерфейса / 界面语言</div>

<div class="lang-current">  [1]  ← Русский  (Russian)</div>
<div class="lang-other">  [2]    English  (English)</div>
<div class="lang-other">  [3]    简体中文  (Chinese (Simplified))</div>

<div class="prompt">→ <span style="background:#fff;color:#000;">_</span></div>

<div class="footer" style="margin-top:24px;">═══════════════════════════════════════════════════════════════════</div>

</body>
</html>
