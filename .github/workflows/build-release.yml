name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.5.0)'
        required: true
        default: 'v2.5.0'

# Права для создания Release и загрузки артефактов
permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build for ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false  # не отменять другие сборки при ошибке одной
      matrix:
        include:
          - rid: win-x64
            artifact: SystemRestoreTool-standalone-win-x64
            r2r: 'true'
          - rid: win-x86
            artifact: SystemRestoreTool-standalone-win-x86
            r2r: 'true'
          - rid: win-arm64
            artifact: SystemRestoreTool-standalone-win-arm64
            r2r: 'false'  # ARM64 crossgen2 crashes on Linux, disable R2R

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: 📦 Restore dependencies
        run: dotnet restore

      - name: 🏗 Build (Release)
        run: dotnet build -c Release --no-restore

      - name: 📤 Publish standalone (${{ matrix.rid }})
        run: |
          dotnet publish -c Release -r ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=${{ matrix.r2r }} `
            -o ./publish-standalone

      - name: 📤 Publish compact (${{ matrix.rid }})
        run: |
          dotnet publish -c Release -r ${{ matrix.rid }} `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=${{ matrix.r2r }} `
            -o ./publish-compact

      - name: 📦 Zip standalone
        run: |
          Compress-Archive -Path ./publish-standalone/SystemRestoreTool.exe `
                            -DestinationPath ${{ matrix.artifact }}.zip

      - name: 📦 Zip compact
        run: |
          Compress-Archive -Path ./publish-compact/SystemRestoreTool.exe `
                            -DestinationPath ${{ matrix.artifact }}-compact.zip

      - name: 🔐 Generate SHA256
        shell: pwsh
        run: |
          (Get-FileHash ${{ matrix.artifact }}.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii ${{ matrix.artifact }}.zip.sha256
          (Get-FileHash ${{ matrix.artifact }}-compact.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii ${{ matrix.artifact }}-compact.zip.sha256

      - name: 📤 Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256

      - name: 📤 Upload compact artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-compact
          path: |
            ${{ matrix.artifact }}-compact.zip
            ${{ matrix.artifact }}-compact.zip.sha256

  release:
    name: 🚀 Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write  # обязательно для создания release

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: 📋 List artifacts
        run: find ./artifacts -type f | sort

      - name: 📝 Prepare release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          # Windows System Recovery Tool v2.5.0
          
          ## 🌐 Multilingual UI (RU / EN / 中文)
          
          Russian · English · 简体中文
          
          ## Downloads
          
          | File | Architecture | Type | Size |
          |------|--------------|------|------|
          | SystemRestoreTool-standalone-win-x64.zip | x64 (Intel/AMD) | Self-contained | ~40 MB |
          | SystemRestoreTool-standalone-win-x86.zip | x86 (32-bit) | Self-contained | ~37 MB |
          | SystemRestoreTool-standalone-win-arm64.zip | ARM64 (Surface/Qualcomm) | Self-contained | ~33 MB |
          | SystemRestoreTool-compact-win-x64.zip | x64 | Requires .NET 6 | ~7 MB |
          | SystemRestoreTool-compact-win-x86.zip | x86 | Requires .NET 6 | ~7 MB |
          | SystemRestoreTool-compact-win-arm64.zip | ARM64 | Requires .NET 6 | ~6 MB |
          
          ## Verification
          
          Verify SHA256 checksums (files ending in `.sha256`).
          
          ## Installation
          
          1. Download the ZIP for your architecture
          2. Extract `SystemRestoreTool.exe`
          3. Right-click → **Run as administrator**
          
          ## Features
          
          - 17 native Win32 APIs through P/Invoke (no shell commands)
          - 67 recovery and diagnostic operations
          - 14 recovery modules (DISM, SFC, WinTrust, SCM, SetupAPI, etc.)
          - File tampering detection via WinVerifyTrust
          - Microsoft.Dism NuGet + COM WUA API integration
          - Multilingual UI: RU / EN / ZH
          
          Full changelog: https://github.com/Ludonist/Windows-System-Recovery-Tool/blob/main/CHANGELOG.md
          EOF

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            ./artifacts/**/*.zip
            ./artifacts/**/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
