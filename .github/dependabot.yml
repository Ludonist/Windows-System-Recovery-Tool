# Dependabot — автоматическое обновление зависимостей
# ВНИМАНИЕ: только NuGet-пакеты. GitHub Actions обновляем вручную,
# чтобы не плодить лишние ветки (Dependabot часто предлагает несуществующие версии).
version: 2
updates:
  # NuGet-пакеты
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "deps"
      include: "scope"
    reviewers:
      - "Ludonist"

  # GitHub Actions — отключено (обновляем вручную)
  # - package-ecosystem: "github-actions"
  #   directory: "/"
  #   schedule:
  #     interval: "monthly"
